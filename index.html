<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>カリンバ練習</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317191f'/%3E%3Cg fill='%2393c5bd'%3E%3Crect x='5' y='6' width='3' height='14' rx='1.5'/%3E%3Crect x='10' y='6' width='3' height='18' rx='1.5'/%3E%3Crect x='15' y='6' width='3' height='21' rx='1.5'/%3E%3Crect x='20' y='6' width='3' height='18' rx='1.5'/%3E%3Crect x='25' y='6' width='3' height='14' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">

<body>
  <div id="sim-banner" class="sim-banner" hidden></div>
  <header class="topbar">
    <h1>カリンバ練習</h1>
    <nav class="nav" aria-label="画面の切り替え">
      <button type="button" class="nav-btn" data-screen="game">練習</button>

      <button type="button" class="nav-btn" data-screen="settings">設定</button>

  <main class="main">
